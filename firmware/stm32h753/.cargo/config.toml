[target.thumbv7em-none-eabihf]
runner = 'probe-rs run --chip STM32H743ZITx'

[build]
target = "thumbv7em-none-eabihf" # Cortex-M4F and Cortex-M7F (with FPU)

[env]
DEFMT_LOG = "trace"

[profile.release]
# symbols are nice and they don't increase the size on Flash
debug = true
# or "z"
# opt-level = "s"
# lto = "fat"

[profile.debug]
opt-level = "s"
lto = "fat"

