[package]
name = "peeler_mouse"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "esp32s3"
path = "src/main.rs"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[features]
# default = ["pcb"]
default = ["pcb", "webserver", "limit_encoder"]
devkit = []
pcb = []
sd = []
webserver = []
limit_encoder = []
limit_switch = []
streaming = ["webserver"]
experimental = ["esp-idf-svc/experimental"]

[dependencies]
# shared = { path = "../shared" }
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["embassy-time-driver", "embassy-sync", "embedded-storage", "experimental"] }
critical-section = { version = "1.1", features = ["std"], default-features = false }
embassy-executor = { version = "0.7", features = ["executor-thread", "arch-std", "task-arena-size-16384"] }
embassy-time = { version = "0.4.0" }
esp-idf-hal = "0.45.2"
dotenvy_macro = "0.15.7"
thiserror = "2.0.12"
embedded-svc = "0.28.1"
embassy-sync = { version = "0.7.0", features = ["std"] }
embassy-futures = "0.1.1"
serde_json = "1.0.141"
anyhow = "1.0.99"
esp-idf-sys = "0.36.1"
heapless = "0.8.0"
serde = { version = "1.0.225", features = ["derive"] }
uom = { version = "0.37.0", features = ["serde", "si", "f32"] }
static_cell = "2.1.1"

# Comms lib
messenger-mouse = { path = "../messenger_mouse" }

# H-Bridge Motor Driver
l9110 = { path = "../l9110" }

# Simple stepper driver
simple-stepper-driver = { path = "../simple_stepper_driver" }
rmt-stepper-driver = { path = "../rmt_stepper_driver" }
embedded-hal = { version = "1.0.0" }

# Encoder
as5048a-async = "0.1"
embedded-hal-async = "1.0"


[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = "components/esp32-camera"
bindings_header = "components/bindings.h"
bindings_module = "camera"


