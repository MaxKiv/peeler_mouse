<!DOCTYPE html>
<html>
  <body>
    <br>
    <canvas id="camCanvas"></canvas>
    <br>
    <!-- Inputs -->
    <div style="display: flex; gap: 10px;">
        <label>Box X/Y: <input type="number" id="boxX" value="50"> <input type="number" id="boxY" value="50"></label>
        <label>Line Start/End: <input type="number" id="lineX1" value="0">,<input type="number" id="lineY1" value="0"> → ...</label>
    </div>
    <hr>
    <input type="number" id="depth" placeholder="Depth Value">
    <button onclick="sendSetpoint()">Send Setpoint</button>

    <!-- Load the external script -->
    <script src="app.js"></script>
    
    <script>
      // Small bridge to connect the HTML button to the JS function
      window.sendSetpoint = function() {
        const depth = document.getElementById("depth").value;
        fetch("/setpoint", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Connection": "close" },
          body: JSON.stringify({ depth: parseFloat(depth) })
        }).then(resp => resp.text()).then(txt => alert("Response: " + txt))
         .catch(err => alert("Error: " + err));
      }
      
      // Auto-start on load
      startUpdates();
    </script>
  </body>
</html>
